# ============================================================
# Minecraft Discord Bridge — runs entirely on your Paper server
# ============================================================

discord:
  # Bot token from https://discord.com/developers/applications
  token: "YOUR_BOT_TOKEN_HERE"
  # Optional: only accept messages from this guild
  # guild-id: "123456789012345678"

# Live bot presence (Online / DND / Offline)
status:
  server-ip: "play.example.com"
  server-name: "My Minecraft Server"
  update-interval-seconds: 30
  # online | maintenance | offline
  default-mode: "online"
  online-activity: "{players}/{max} online | {ip}"
  maintenance-activity: "Under maintenance | {ip}"
  offline-activity: "Offline | {ip}"

defaults:
  # Default if a channel entry does not set mode
  mode: webhook
  webhook-name: "Minecraft Server"
  player-avatar-url: "https://mc-heads.net/avatar/{name}"

# ------------------------------------------------------------
# CHANNELS — each entry is a list item:
#
#   channel:      Discord channel ID
#   mode:         webhook  OR  bot
#   webhook-url:  (only when mode is webhook) paste the webhook link here
#                 Leave empty to let the bot create/manage a webhook
#                 (bot needs Manage Webhooks permission)
#
# Add more list items under the same type to post to multiple channels.
# ------------------------------------------------------------
channels:
  chat:
    - channel: "CHAT_CHANNEL_ID"
      mode: webhook
      webhook-url: ""
    # Example second channel as the bot instead:
    # - channel: "ANOTHER_CHANNEL_ID"
    #   mode: bot

  join:
    - channel: "CHAT_CHANNEL_ID"
      mode: webhook
      webhook-url: ""

  leave:
    - channel: "CHAT_CHANNEL_ID"
      mode: webhook
      webhook-url: ""

  death:
    - channel: "CHAT_CHANNEL_ID"
      mode: webhook
      webhook-url: ""

  advancement:
    - channel: "CHAT_CHANNEL_ID"
      mode: webhook
      webhook-url: ""

  server:
    - channel: "CONSOLE_CHANNEL_ID"
      mode: bot

  console:
    - channel: "CONSOLE_CHANNEL_ID"
      mode: bot

# Discord → Minecraft
inbound:
  chat-channels:
    - "CHAT_CHANNEL_ID"
  console-command-channels:
    - "CONSOLE_CHANNEL_ID"
  # Role names or IDs allowed to run console commands (empty = anyone in those channels)
  allowed-roles:
    - "Admin"
    - "Moderator"
  command-prefix: "!"

formats:
  chat-to-discord: "**{player}**: {message}"
  chat-to-minecraft: "§9[Discord] §f{user}§7: §f{message}"
  join: "{player} joined the game"
  leave: "{player} left the game"
  death: "{message}"
  advancement: "{player} has made the advancement [{advancement}]"
  server-start: "✅ Server started"
  server-stop: "🔴 Server stopped"
