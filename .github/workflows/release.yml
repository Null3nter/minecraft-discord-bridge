name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0) without v prefix"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build plugin
        working-directory: plugin
        run: mvn -B clean package

      - name: Prepare asset
        run: |
          mkdir -p release-assets
          JAR=$(ls plugin/target/minecraft-discord-bridge-*.jar | grep -v original | head -n1)
          cp "$JAR" "release-assets/MinecraftDiscordBridge-${{ steps.ver.outputs.version }}.jar"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: release-assets/*
          body: |
            ## Minecraft Discord Bridge ${{ steps.ver.outputs.tag }}

            Self-contained Paper plugin — put the JAR in `plugins/`, configure token + channels, restart.

            ### Install
            1. Download `MinecraftDiscordBridge-${{ steps.ver.outputs.version }}.jar`
            2. Place in `plugins/`
            3. Restart once, edit `plugins/MinecraftDiscordBridge/config.yml`
            4. Restart again
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
