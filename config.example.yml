# Copy this file to config.yml and fill in your values

discord:
  token: "YOUR_BOT_TOKEN_HERE"
  # Optional: only listen in this guild
  # guildId: "123456789012345678"

minecraft:
  rcon:
    host: "127.0.0.1"
    port: 25575
    password: "change_me"
  # Path to the server's latest.log (used for chat + events)
  logFile: "./logs/latest.log"

# ---------------------------------------------------------------------------
# LIVE SERVER STATUS (bot presence)
# ---------------------------------------------------------------------------
# The bot will show different Discord statuses:
#   Online          → green / Online   + player count + IP
#   Do Not Disturb  → red   / DND      (maintenance mode)
#   Offline         → invisible        (can't reach the server)
#
# Switch modes from a console command channel:
#   !status online
#   !status maintenance
#   !status offline
status:
  serverIp: "play.example.com"          # shown in the activity
  serverName: "My Minecraft Server"
  updateIntervalSeconds: 30             # how often to refresh player count
  defaultMode: "online"                 # online | maintenance | offline
  # Activity text (placeholders: {players} {max} {ip} {name})
  onlineActivity: "{players}/{max} online | {ip}"
  maintenanceActivity: "Under maintenance | {ip}"
  offlineActivity: "Offline | {ip}"

# Global defaults applied when a destination does not override them
defaults:
  useWebhook: true
  webhookName: "Minecraft Server"
  playerAvatarUrl: "https://mc-heads.net/avatar/{name}"

# ---------------------------------------------------------------------------
# ROUTING – multi-channel + mix of webhooks / bot
# ---------------------------------------------------------------------------
channels:
  chat:
    - channelId: "CHAT_CHANNEL_ID_1"
      useWebhook: true
    - channelId: "CHAT_CHANNEL_ID_2"
      useWebhook: false

  console:
    - channelId: "CONSOLE_CHANNEL_ID"
      useWebhook: false

  join:
    - channelId: "CHAT_CHANNEL_ID_1"
    - channelId: "EVENTS_CHANNEL_ID"

  leave:
    - channelId: "CHAT_CHANNEL_ID_1"

  death:
    - channelId: "CHAT_CHANNEL_ID_1"

  advancement:
    - channelId: "CHAT_CHANNEL_ID_1"

  server:
    - channelId: "CONSOLE_CHANNEL_ID"

inbound:
  chatChannels:
    - "CHAT_CHANNEL_ID_1"
  consoleCommandChannels:
    - "CONSOLE_CHANNEL_ID"
  allowedRoles:
    - "Admin"
    - "Moderator"
  commandPrefix: "!"

formats:
  chatToDiscord: "**{player}**: {message}"
  chatToMinecraft: "§9[Discord] §f{user}§7: §f{message}"
  join: "§e{player} joined the game"
  leave: "§e{player} left the game"
  death: "{message}"
  advancement: "{player} has made the advancement [{advancement}]"
  serverStart: "✅ Server started"
  serverStop: "🔴 Server stopped"
